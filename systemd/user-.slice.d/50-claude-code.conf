# /etc/systemd/system/user-.slice.d/50-claude-code.conf
#
# One runaway guard for every user of a shared host. systemd puts each logged-in
# user in their own user-<UID>.slice, and "user-.slice.d" is a template drop-in,
# so this single file applies to all of them with no per-user maintenance.
# After installing: `systemctl daemon-reload`.
#
# The file sets TasksMax and nothing else. TasksMax is valid on cgroup v1 and v2
# alike, so the same file is installed on every host. It caps the task count
# inside the offending user's own slice: new forks past the limit fail, nothing
# already running is touched, and no other user is affected. That stops a fork
# bomb, which is the failure that actually wedges a machine. The value is
# generous for many-worker jobs and parallel builds and far below a fork bomb.
#
# WHY THERE IS NO MEMORY LIMIT
# A shared host wants a SOFT memory limit: slow a heavy user only when the
# machine is contended, and let one user have most of the RAM when it is idle.
# systemd cannot express that on cgroup v1. Its only v1 memory directive is
# MemoryLimit=, a hard ceiling that ends in the OOM killer; the soft directive
# (MemoryHigh=, which throttles and reclaims but does not kill) is cgroup v2
# only. A hard cap set near a "fair share" figure sits below the legitimate
# peak of a large job and kills it, and the limit applies to an already-running
# slice the moment daemon-reload completes. Losing work is worse than no limit.
#
# WHY THERE IS NO CPU LIMIT
#  - A template user slice cannot be scoped to one application. Any limit here
#    governs every process the user runs, not only Claude Code.
#  - CPUQuota= is a hard ceiling: it throttles even when the other cores are
#    idle and nobody else is logged in, which is exactly when a large build or
#    batch job should use the whole machine.
#  - Fairness is a weight (CPUShares= on v1, CPUWeight= on v2), which only bites
#    under contention. The systemd default weight already gives every user
#    slice an equal share, so setting it to the default would change nothing.
#  - CPU saturation resolves itself: a loaded scheduler still schedules.
#
# WHY THERE IS NO I/O WEIGHT
# BlockIOWeight= maps to cgroup v1 blkio.weight, which only the CFQ and BFQ
# schedulers enforce. On a host using mq-deadline or none the line is accepted
# and enforces nothing, so it would read as a control and not be one.
#
# To protect the operating system from its users, reserve capacity for
# system.slice rather than capping users; that, like a soft memory limit,
# needs cgroup v2 (stat -fc %T /sys/fs/cgroup prints cgroup2fs on v2, tmpfs
# on v1). A host with one user needs no CPU or memory limit at all.
#
# Verify in force:
#   systemctl show user-$(id -u).slice -p TasksMax -p CPUQuotaPerSecUSec -p MemoryMax
# TasksMax shows the value below and CPUQuotaPerSecUSec shows infinity. Removing
# a directive from this file does not always clear it from a slice that is
# already running; clear it explicitly: systemctl set-property user-<UID>.slice CPUQuota=

[Slice]
TasksMax=12288
