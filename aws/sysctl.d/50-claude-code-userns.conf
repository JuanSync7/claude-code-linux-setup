# 50-claude-code-userns.conf - install to /etc/sysctl.d/, root:root 0644.
# Apply with: sysctl --system   (or a reboot; cloud-init applies it at boot).
#
# WHY THIS EXISTS
# The managed policy is read by claude from the per-host file
# /etc/claude-code/managed-settings.json. With the sandbox disabled fleet-wide
# (docs/SANDBOX-DECISION.md) that file is the ONLY thing standing between a user
# and an ungoverned agent - there is no kernel enforcement behind it.
#
# An unprivileged user with user namespaces available can neutralise it entirely
# for their own sessions, WITHOUT sudo, in five lines:
#
#     unshare --user --map-root-user --mount /bin/sh -c '
#       mount --bind /my/own/policy.json /etc/claude-code/managed-settings.json
#       exec claude'
#
# Inside that namespace claude reads the attacker's policy: no deny list, no
# audit hooks, no autoMode. The host view is untouched, so cc-healthcheck.sh
# never sees it. docs/LOCAL-VS-AWS.md 8.2 has the reasoning.
#
# chmod/chown on /etc/claude-code does NOT stop this: a bind-mount over a file
# needs only traverse on the 0755 parent (which everyone needs) plus mount
# capability (which the user namespace confers) - it never needs write on the
# target. Removing the capability is the only fix.
#
# Setting this to 0 blocks creation of user namespaces by unprivileged users.
# It does NOT break cc-admin-session.sh: that runs as root (via sudo) and takes
# a MOUNT namespace only (unshare --mount, deliberately not --user), which needs
# CAP_SYS_ADMIN, not a user namespace. It is unaffected by this knob.
#
# KNOWN INTERACTION - TEST IN THE AMI BEFORE SHIPPING: Chromium's sandbox is
# user-namespace-based, and a Chromium build is among the OAuth login browsers
# profile.d/claude-code-browser.* looks for. With unprivileged userns off, Chromium may
# refuse to start unless a setuid chrome-sandbox helper is present, or it is
# launched --no-sandbox. If OAuth login stops opening a window after this lands,
# this is the cause. See aws/README.md.
user.max_user_namespaces = 0
