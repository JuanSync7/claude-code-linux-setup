# 10-claude-code-posture.conf - make interactive login DEPEND on the policy.
# Install to /etc/systemd/system/systemd-user-sessions.service.d/, root:root 0644.
# [PLANNED - AWS VDI, not yet validated on an AMI.]
#
# WHY THIS EXISTS
# claude-code-posture.service carries Before=systemd-user-sessions.service, but
# Before= is ORDERING ONLY: if the posture unit fails, systemd still starts
# user-sessions and the engineer logs in with whatever policy happens to be on
# disk - or none. On a VDI the user has no sudo and cannot be asked to check, so
# that outcome is silent and ungoverned. Requires= converts it into a refusal.
#
# READ THIS BEFORE INSTALLING - IT IS A DELIBERATE FAIL-CLOSED CHOICE.
# With this drop-in, a broken policy stage means the instance ACCEPTS NO
# INTERACTIVE LOGINS. That is the intended failure mode: a VDI
# that will not log in is loudly broken and gets replaced from the AMI (rebuild
# is cheap - docs/LOCAL-VS-AWS.md §4), whereas a VDI that logs in with no policy
# is silently processing customer data outside the governed configuration.
#
# Break-glass, and why this does not lock you out of the instance entirely:
# systemd-user-sessions gates PAM interactive logins. It does NOT gate the SSM
# agent, which runs as its own root service, so AWS Systems Manager Session
# Manager still reaches the box to read /var/log/claude-code/posture.log and
# `systemctl status claude-code-posture`. Confirm SSM is installed and enrolled
# in the AMI BEFORE shipping this file - on an instance with no SSM and no
# console access, a posture failure is unrecoverable except by replacement.
#
# To choose fail-OPEN instead, do not install this file. Then a posture failure
# is visible only in `systemctl --failed` and the shipped logs, and logins
# proceed regardless.
[Unit]
Requires=claude-code-posture.service
After=claude-code-posture.service
